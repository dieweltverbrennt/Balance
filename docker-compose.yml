services:
  frontend:
    build: ./frontend

    ports:
      - '5173:5173'

    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build: ./backend

    ports:
      - '3000:3000'

    depends_on:
      - postgres

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
